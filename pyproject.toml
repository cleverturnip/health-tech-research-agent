[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-tech-research-agent"
version = "0.1.0"
description = "Stabilized workflow foundation for the Health Tech Research Agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # FastAPI TestClient (webapp tests)
]
# The Phase-1 hosted-dashboard web shell (FastAPI on Render). Optional extra — the package must import and the
# offline suite must run without it (webapp tests skip if FastAPI is absent). Install with `pip install -e .[web]`.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "itsdangerous>=2.1",       # SessionMiddleware cookie signing
    "python-multipart>=0.0.9", # login form parsing
    "openai>=1.0",             # GATE-1 in-app discovery calls the OpenAI API on the server
]
# The research runner calls the OpenAI API. It is an OPTIONAL extra, not a hard
# dependency: the package must import and the test suite must run offline with no
# API key (tests inject a fake client). Install with `pip install -e .[research]`
# in the environment that actually runs live research (e.g. Colab).
research = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
