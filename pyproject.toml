[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-tech-research-agent"
version = "0.1.0"
description = "Stabilized workflow foundation for the Health Tech Research Agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
