# Render Blueprint for the Phase-1 hosted dashboard (front-end).
# Create a Render "Blueprint" from this repo; Render reads this file, provisions the web service, and prompts
# for the three secrets marked `sync: false`. Nothing sensitive is stored in this file (it's in the public repo).
#
# The app is a thin FastAPI shell over the package (specs/FRONT_END_PHASE1_HOSTED_DASHBOARD.md). Editable install
# keeps the package importable from the repo checkout so it can find taxonomy/ (segment labels) at runtime.
services:
  - type: web
    name: htra-dashboard
    runtime: python
    plan: starter             # always-on: a research run lasts 30min–hours, and a persistent disk needs a paid plan
    buildCommand: pip install -e ".[web]"
    startCommand: uvicorn health_tech_research_agent.webapp.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: htra-jobs
      mountPath: /var/htra
      sizeGB: 1               # research checkpoint / manifest / job-status — survives restarts (Rule 4 resume)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HTRA_SECURE_COOKIE
        value: "true"          # the session cookie is HTTPS-only in prod (Render serves TLS)
      - key: HTRA_WORK_DIR
        value: "/tmp/htra_work"
      - key: HTRA_SESSION_SECRET
        generateValue: true    # Render generates a strong random value; never in the repo
      # --- secrets you paste into the Render dashboard (kept OUT of the public repo) ---
      - key: HTRA_PASSWORD_HASH
        sync: false            # the PBKDF2 hash of your app password (see the hash command in the deploy steps)
      - key: HTRA_GOOGLE_CREDENTIALS_FILE
        # Point at a Render SECRET FILE (Dashboard → Environment → Secret Files) named `service_account.json`
        # with the key contents. A mounted file avoids the env-var paste-mangling that breaks pasted JSON.
        value: /etc/secrets/service_account.json
      - key: HTRA_DRIVE_FOLDER_ID
        sync: false            # your "HTRA Dashboard Data" Drive folder id
      - key: OPENAI_API_KEY
        sync: false            # GATE-1 discovery + the research runner (OpenAI + web search)
      - key: HTRA_JOBS_DIR
        value: /var/htra/jobs  # research-job state on the persistent disk → survives restarts, auto-resumes
      - key: HTRA_BASE_URL
        value: https://htra-dashboard.onrender.com   # for the link in the notification email
      - key: HTRA_NOTIFY_EMAIL
        value: lavallee.kj@gmail.com                 # where run-complete / run-failed emails go
      - key: RESEND_API_KEY
        sync: false            # Resend transactional-email API key (free tier) — for run notifications
